# VaayuMitra — Render Blueprint (plan.md Step 6.1)
# Apply: connect this repo in Render Dashboard -> New -> Blueprint -> select render.yaml,
# or `render blueprint launch` with the Render CLI. Then set the sync:false secrets below
# in the dashboard (never commit them — AGENTS.md #3.6).
#
# After the first deploy, update BACKEND_URL to the live
# https://vaayumitra-backend.onrender.com URL (and MCP_SERVER_URL if explicit),
# then redeploy so llm.mcp_servers is public HTTPS (required by Agora).
# Frontend deploys separately on Vercel — see README.md Deploy section.
services:
  - type: web
    name: vaayumitra-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Render injects PORT automatically; server.py reads it (Dockerfile default 8000).
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: BACKEND_URL
        value: https://vaayumitra-backend.onrender.com
      - key: FRONTEND_URL
        value: http://localhost:3000
      - key: USE_MOCK_IMD
        value: "true"
      - key: IDLE_TIMEOUT
        value: "120"
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: CREDENTIAL_MODE
        value: managed
      - key: SARVAM_API_KEY
        sync: false
      # Phase 6.3: PSTN stays off until Agora grants the Telephony Beta.
      # After the grant, set TELEPHONY_ENABLED=true + TELEPHONY_FROM_NUMBER in
      # the dashboard and point the Console webhook at POST /telephonyWebhook.
      - key: TELEPHONY_ENABLED
        value: "false"
